name: SDK size updates

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-sdk-sizes:
    permissions:
      contents: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-updates.yml@f1669c081bca009a0aa0978561096d32bfd156df # v1.4.0
    with:
      release-bot-client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
      modules: "stream-feeds-android-client"
      metrics-project: "stream-feeds-android-metrics"
    secrets:
      release-bot-private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
